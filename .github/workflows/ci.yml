name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package with the MCP extra and pytest
        run: python -m pip install -e ".[mcp]" pytest
      - name: Run the offline test suite
        run: python -m pytest -q

  receiver:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/windows-receiver
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Show the toolchain selected by rust-toolchain.toml
        run: rustup show
      - name: Run the receiver's offline tests
        run: cargo test --locked
