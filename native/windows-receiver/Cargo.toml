[package]
name = "dexdesk"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/primary-null/ADAPT"
description = "A small native Windows receiver for wireless Samsung DeX"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
windows = { version = "0.58", features = [
    "Foundation", "Foundation_Collections",
    "Devices_WiFiDirect", "Devices_Enumeration",
    "Networking", "Networking_Sockets",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
